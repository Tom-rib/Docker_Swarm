###############################################################################
# Nginx Configuration - Reverse Proxy & Load Balancer
#
# Ce fichier doit être placé sur le serveur NFS :
# /export/docker/nginx/default.conf
#
# Il est monté dans les conteneurs Nginx :
# /etc/nginx/conf.d/default.conf
###############################################################################

# ============================================================================
# Backend PHP-FPM (Upstream)
# ============================================================================

upstream php_backend {
    # Résolution DNS Swarm automatique (Swarm DNS = 127.0.0.11:53)
    # Le service "php-fpm" est automatiquement résolu par Swarm
    
    # Configuration du load balancing
    least_conn;  # Envoyer vers le serveur avec le moins de connexions
    
    # Plusieurs instances PHP-FPM (Swarm gère automatiquement)
    server php-fpm:9000 max_fails=3 fail_timeout=30s;
}

# ============================================================================
# Upstream MariaDB (pour les futures connexions)
# ============================================================================

upstream mariadb_backend {
    server mariadb:3306;
}

# ============================================================================
# Serveur HTTP (Redirection HTTPS)
# ============================================================================

server {
    listen 80;
    server_name _;
    
    # Redirection HTTP → HTTPS (en production)
    # Pour le développement, garder HTTP
    # return 301 https://$server_name$request_uri;
    
    client_max_body_size 100M;
    
    # Access et error logs
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;
    
    # ====================================================================
    # ROOT & INDEX
    # ====================================================================
    
    root /var/www/html;
    index index.php index.html index.htm;
    
    # ====================================================================
    # GESTION DES FICHIERS STATIQUES
    # ====================================================================
    
    # CSS, JS, Images (cache agressif)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }
    
    # ====================================================================
    # PROXY VERS PHP-FPM
    # ====================================================================
    
    # Tous les fichiers .php vont vers PHP-FPM
    location ~ \.php$ {
        # Vérifier que le fichier existe
        try_files $uri =404;
        
        # Configuration FastCGI
        fastcgi_pass php_backend;
        
        # Paramètres FastCGI standards
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Inclure tous les paramètres FastCGI
        include fastcgi_params;
        
        # Timeouts
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
        
        # Buffers
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        
        # Headers
        fastcgi_pass_header Server;
        fastcgi_hide_header X-Powered-By;
    }
    
    # ====================================================================
    # RÉÉCRITURE D'URLS
    # ====================================================================
    
    # Bloquer l'accès aux fichiers cachés
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Réécriture pour un framework (ex: Laravel, Symfony)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # ====================================================================
    # HEADERS DE SÉCURITÉ
    # ====================================================================
    
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "microphone=(), geolocation=()" always;
    
    # ====================================================================
    # GESTION DES ERREURS
    # ====================================================================
    
    # Pages d'erreur personnalisées (optionnel)
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    # ====================================================================
    # SANTÉ CHECK (pour le load balancer Docker)
    # ====================================================================
    
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

