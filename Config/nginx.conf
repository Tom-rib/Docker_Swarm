###############################################################################
# NOTES DE CONFIGURATION
###############################################################################

# 1. SERVICES SWARM UTILISÉS :
#    - php-fpm:9000     (Pool de processs PHP sur le port 9000)
#    - mariadb:3306     (Base de données MariaDB)
#
#    Ces services sont automatiquement découverts par Swarm DNS

# 2. LOAD BALANCING :
#    - least_conn : Envoie vers le serveur avec le moins de connexions
#    - Alternatives :
#      * round_robin (défaut)
#      * ip_hash (même client = même serveur)
#      * random (aléatoire)
#      * least_time (temps réponse le plus court)

# 3. FICHIERS STATIQUES :
#    - Cachés pendant 30 jours (expires 30d)
#    - Logs d'accès désactivés (access_log off)
#    - Immuables pour le cache (Cache-Control: immutable)

# 4. SÉCURITÉ :
#    - Headers anti-XSS
#    - Content-Type sniffing prevention
#    - X-Frame-Options (clickjacking)
#    - Fichiers cachés bloqués (location ~ /\.)

# 5. PERFORMANCE :
#    - FastCGI buffering optimisé
#    - Timeouts configurés
#    - Compression (à ajouter si nécessaire)
#    - HTTP/2 (en HTTPS)

# 6. PROXYING PHP-FPM :
#    - fastcgi_pass php_backend
#    - Résolution DNS Swarm automatique
#    - Redirection transparente vers n'importe quelle instance PHP

# 7. DÉPLOIEMENT :
#    - Placer ce fichier sur le serveur NFS : /export/docker/nginx/default.conf
#    - Monté automatiquement dans le conteneur Nginx
#    - Rechargement de config : docker service update --force nginx

# 8. TESTER LA CONFIGURATION :
#    - Dans le conteneur Nginx : nginx -t
#    - Depuis l'hôte : curl http://localhost
#    - Vérifier les logs : docker service logs nginx

